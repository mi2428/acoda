[project]
name = "acoda-nbc"
version = "0.1.0"
description = "Deterministic fictional NBC-themed Python source transformations"
requires-python = ">=3.15,<3.16"
dependencies = ["libcst==1.9.0"]

[project.scripts]
acoda = "acoda.cli:main"

[dependency-groups]
dev = ["ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acoda"]

[tool.hatch.build.targets.sdist]
exclude = ["/dist"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.15"
